<?xml version="1.0" encoding="UTF-8"?>
<!--
  Исходный вектор иконки приложения Cryon (совпадает с LogoMark в
  frontend/src/shared/ui/Logo.tsx). Из него генерируются растровые
  build/appicon.png и build/windows/icon.ico — см. build/README-icons.md.
-->
<svg width="1024" height="1024" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cryonBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b1a6e" />
      <stop offset="1" stop-color="#150c2c" />
    </linearGradient>
    <linearGradient id="cryonStroke" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc" />
      <stop offset="0.5" stop-color="#a855f7" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#cryonBg)" stroke="url(#cryonStroke)" stroke-width="2.5" />

  <path d="M44.3 23.4A15 15 0 1 0 44.3 40.6" stroke="url(#cryonStroke)" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <g fill="#e9d5ff">
    <rect x="24.5" y="27" width="3.4" height="10" rx="1.7" />
    <rect x="30.3" y="23" width="3.4" height="18" rx="1.7" />
    <rect x="36.1" y="25.5" width="3.4" height="13" rx="1.7" />
  </g>
</svg>
