name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Sync go.sum
        run: go mod tidy

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (exe + NSIS installer)
        run: wails build -nsis

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/bin/Cryon2.exe "dist/Cryon2-${{ github.ref_name }}-windows-amd64.exe"
          if (Test-Path build/bin/Cryon2-amd64-installer.exe) {
            Copy-Item build/bin/Cryon2-amd64-installer.exe "dist/Cryon2-${{ github.ref_name }}-windows-installer.exe"
          }
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryon-windows
          path: dist/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Embed frontend into mobile package
        run: |
          rm -rf mobile/dist
          cp -r frontend/dist mobile/dist

      - name: gomobile bind (arm64 only, меньший APK)
        working-directory: mobile
        run: |
          go mod tidy
          gomobile bind -target=android/arm64 -androidapi 24 \
            -o ../android/app/libs/cryonmobile.aar -tags cryonmobile .

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/Cryon2-${{ github.ref_name }}-android-arm64.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryon-android
          path: dist/*

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cryon-windows
          path: dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: cryon-android
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
