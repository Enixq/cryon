name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example v0.2.15'
        required: true

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Sync go.sum
        run: go mod tidy

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (exe + NSIS installer)
        run: wails build -nsis -ldflags "-X Cryon2/internal/update.Version=${{ env.RELEASE_VERSION }}"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/bin/Cryon2.exe "dist/Cryon2-${{ env.RELEASE_VERSION }}-windows-amd64.exe"
          if (Test-Path build/bin/Cryon2-amd64-installer.exe) {
            Copy-Item build/bin/Cryon2-amd64-installer.exe "dist/Cryon2-${{ env.RELEASE_VERSION }}-windows-installer.exe"
          }
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryon-windows
          path: dist/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Embed frontend into mobile package
        run: |
          rm -rf mobile/dist
          cp -r frontend/dist mobile/dist

      - name: gomobile bind (arm64 only, меньший APK)
        working-directory: mobile
        run: |
          mkdir -p ../android/app/libs
          go mod tidy
          gomobile bind -target=android/arm64 -androidapi 24 \
            -ldflags "-X Cryon2/internal/update.Version=${RELEASE_VERSION}" \
            -o ../android/app/libs/cryonmobile.aar -tags cryonmobile .
          test -s ../android/app/libs/cryonmobile.aar

      - name: Prepare signing key
        shell: bash
        env:
          CRYON_KEYSTORE_BASE64: ${{ secrets.CRYON_KEYSTORE_BASE64 }}
        run: |
          test -n "$CRYON_KEYSTORE_BASE64"
          echo "$CRYON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cryon-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          CRYON_KEYSTORE_PATH: ${{ runner.temp }}/cryon-release.jks
          CRYON_KEYSTORE_PASSWORD: ${{ secrets.CRYON_KEYSTORE_PASSWORD }}
          CRYON_KEY_ALIAS: ${{ secrets.CRYON_KEY_ALIAS }}
          CRYON_KEY_PASSWORD: ${{ secrets.CRYON_KEY_PASSWORD }}
          CRYON_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK uses the existing release signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_url=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Enixq/cryon/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-android-arm64.apk")) | .browser_download_url')
          test -n "$previous_url"
          curl --fail --location --silent --show-error --retry 3 \
            "$previous_url" -o "$RUNNER_TEMP/cryon-previous.apk"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          previous_certificate=$("$signer" verify --print-certs "$RUNNER_TEMP/cryon-previous.apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          current_certificate=$("$signer" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          test -n "$previous_certificate"
          test "$current_certificate" = "$previous_certificate" || { echo "Release signing certificate changed; refusing to publish an incompatible update."; exit 1; }
          echo "Release signing certificate matches the previous published APK."

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/Cryon2-${{ env.RELEASE_VERSION }}-android-arm64.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryon-android
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cryon-windows
          path: dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: cryon-android
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
