name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Sync go.sum
        run: go mod tidy

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (exe + NSIS installer)
        run: wails build -nsis -ldflags "-X Cryon2/internal/update.Version=${{ github.ref_name }}"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/bin/Cryon2.exe "dist/Cryon2-${{ github.ref_name }}-windows-amd64.exe"
          if (Test-Path build/bin/Cryon2-amd64-installer.exe) {
            Copy-Item build/bin/Cryon2-amd64-installer.exe "dist/Cryon2-${{ github.ref_name }}-windows-installer.exe"
          }
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryon-windows
          path: dist/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Embed frontend into mobile package
        run: |
          rm -rf mobile/dist
          cp -r frontend/dist mobile/dist

      - name: gomobile bind (arm64 only, меньший APK)
        working-directory: mobile
        run: |
          mkdir -p ../android/app/libs
          go mod tidy
          gomobile bind -target=android/arm64 -androidapi 24 \
            -ldflags "-X Cryon2/internal/update.Version=${GITHUB_REF_NAME}" \
            -o ../android/app/libs/cryonmobile.aar -tags cryonmobile .
          test -s ../android/app/libs/cryonmobile.aar

      - name: Prepare signing key
        shell: bash
        env:
          CRYON_KEYSTORE_BASE64: ${{ secrets.CRYON_KEYSTORE_BASE64 }}
        run: |
          test -n "$CRYON_KEYSTORE_BASE64"
          echo "$CRYON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cryon-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          CRYON_KEYSTORE_PATH: ${{ runner.temp }}/cryon-release.jks
          CRYON_KEYSTORE_PASSWORD: ${{ secrets.CRYON_KEYSTORE_PASSWORD }}
          CRYON_KEY_ALIAS: ${{ secrets.CRYON_KEY_ALIAS }}
          CRYON_KEY_PASSWORD: ${{ secrets.CRYON_KEY_PASSWORD }}
          CRYON_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/Cryon2-${{ github.ref_name }}-android-arm64.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryon-android
          path: dist/*

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cryon-windows
          path: dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: cryon-android
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
