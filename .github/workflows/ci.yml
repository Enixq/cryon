name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # windows-latest: основной пакет использует Wails/WebView2, под Linux
    # сборке нужны GTK/CGO-зависимости, которых в чистом раннере нет.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Sync go.sum
        # Корневой go.sum не лежит в репо (см. .gitignore) — как и в release.yml.
        run: go mod tidy

      - name: Placeholder for go:embed
        # main.go встраивает frontend/dist; в чистом чекауте его нет.
        # Тестам содержимое не нужно — важно только, чтобы пакет компилировался.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path frontend/dist -Force | Out-Null
          Set-Content frontend/dist/index.html '<!doctype html>'

      - name: Vet
        run: go vet ./...

      - name: Test
        # Live-тесты (YouTube, mpv) в CI не запускаются: они gated по
        # CRYON_YOUTUBE_LIVE_IT / CRYON_AUDIO_IT и требуют сети/бинарей.
        run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm run test
